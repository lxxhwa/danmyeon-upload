name: 썸네일 확인

# 유튜브 최근 편 썸네일을 모아 보고, 최근 두 편 썸네일을 첫 장면으로 바꿔 봐요.
on:
  push:
    branches: [claude/project-thread-44wmgt]
    paths: [.github/workflows/thumb-diag.yml, diag/*.py]

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests && sudo apt-get -qq install -y ffmpeg >/dev/null
      - name: 지금 썸네일 받기
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python3 diag/thumb_diag.py > /dev/null && mkdir -p before && cp out/*_oar2.jpg before/
      - name: 최근 두 편 썸네일을 첫 장면으로
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python3 diag/set_thumb.py 024_hoover_dam,023_panama_canal
      - name: 바뀐 썸네일 다시 받기
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: sleep 90 && rm -rf out && python3 diag/thumb_diag.py | grep -E "02[34]_|scope"
      - name: 모아서 저장
        run: |
          ls before/*.jpg | head -0
          ffmpeg -loglevel error -y $(for f in before/01[4-9]*_oar2.jpg before/02*_oar2.jpg; do echo -i $f; done) -filter_complex "$(n=$(ls before/01[4-9]*_oar2.jpg before/02*_oar2.jpg | wc -l); for i in $(seq 0 $((n-1))); do printf "[$i]scale=180:320[s$i];"; done; for i in $(seq 0 $((n-1))); do printf "[s$i]"; done; echo "hstack=$n")" diag/before.jpg
          ffmpeg -loglevel error -y -i out/023_panama_canal_oar2.jpg -i out/024_hoover_dam_oar2.jpg -i out/023_panama_canal_maxres.jpg -i out/024_hoover_dam_maxres.jpg -filter_complex "[0]scale=-2:320[a];[1]scale=-2:320[b];[2]scale=-2:320[c];[3]scale=-2:320[d];[a][b][c][d]hstack=4" diag/after.jpg
          git config user.name "upload-bot"; git config user.email "upload-bot@users.noreply.github.com"
          git add diag/before.jpg diag/after.jpg && git commit -m "썸네일 확인 결과" && git push
