name: 업로드 (만약도감)

# 만약도감 채널용이에요. 매일 18:00 KST에 queue_manyak/ 에서 안 올린 편 하나를 유튜브에 올려요.
# 바로 공개하면 쇼츠 피드에 안 뜬 적이 있어서, 비공개로 올리고 10분 뒤 공개되게 예약해요.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      platforms:
        description: "올릴 곳 (쉼표로 구분)"
        default: "youtube"
      yt_publish_at:
        description: "유튜브 예약 공개 시각 (UTC, 예: 2026-11-02T09:00:00Z). 비우면 10분 뒤 공개"
        default: ""
      test:
        description: "시험 업로드 (true면 올린 기록을 남기지 않아요)"
        type: boolean
        default: false
      daily:
        description: "매일 저녁 예약용 (true면 저녁 시간·12시간 중복 확인을 하고 올려요)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: upload

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: 지금 올릴 때인지 확인
        id: gate
        if: github.event_name == 'schedule' || inputs.daily
        run: |
          now_h=$(TZ=Asia/Seoul date +%H)
          git fetch -q origin main
          last=$(git log -1 --format=%ct FETCH_HEAD -- posted_manyak.json); ago=$(( ($(date +%s) - last) / 3600 ))
          if [ "$now_h" -lt 18 ] || [ "$now_h" -gt 21 ]; then echo "지금 ${now_h}시(KST)라 저녁이 아니어서 넘어가요"; echo skip=1 >> "$GITHUB_OUTPUT"
          elif [ "$ago" -lt 12 ]; then echo "${ago}시간 전에 이미 올렸어요"; echo skip=1 >> "$GITHUB_OUTPUT"
          else echo "올릴게요"; fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 다음 편 올리기
        if: steps.gate.outputs.skip != '1'
        env:
          QUEUE_DIR: queue_manyak
          STATE_FILE: posted_manyak.json
          DAILY_FROM: "1"
          PLATFORMS: ${{ inputs.platforms || 'youtube' }}
          YT_PUBLISH_AT: ${{ inputs.yt_publish_at }}
          YT_PUBLISH_DELAY_MIN: "10"
          SCHEDULED: ${{ github.event_name == 'schedule' || inputs.daily }}
          TEST_RUN: ${{ inputs.test && 'true' || 'false' }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.MANYAK_YT_REFRESH_TOKEN }}
        run: |
          if [ -z "$YT_REFRESH_TOKEN" ]; then echo "만약도감 유튜브 열쇠(MANYAK_YT_REFRESH_TOKEN)가 아직 없어요."; exit 0; fi
          python upload.py
      - name: 재생목록에 넣기
        # 방금 올린 편을 playlists.json 에 맞는 재생목록(전체 포함)에 넣어요. 실패해도 업로드는 그대로예요.
        if: always() && !inputs.test && steps.gate.outputs.skip != '1' && contains(inputs.platforms || 'youtube', 'youtube')
        continue-on-error: true
        env:
          QUEUE_DIR: queue_manyak
          STATE_FILE: posted_manyak.json
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.MANYAK_YT_REFRESH_TOKEN }}
        run: python playlists.py
      - name: 올린 기록 저장
        if: always() && !inputs.test && steps.gate.outputs.skip != '1'
        run: |
          git config user.name "upload-bot"
          git config user.email "upload-bot@users.noreply.github.com"
          git add posted_manyak.json || true; git add playlist_ids.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "업로드 기록 (만약도감)" && for i in 1 2 3 4; do git pull -q --rebase origin main && git push && break; sleep $((i*5)); done)
