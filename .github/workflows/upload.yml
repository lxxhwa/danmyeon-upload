name: 업로드

on:
  schedule:
    # 매일 18:00 KST (= 09:00 UTC)에 깨어나요. 대기 영상이 7편 미만이면 월·수·금에만 올리고,
    # 7편 이상 쌓이면 매일 올려요. 깃허브 사정으로 몇 분~수십 분 늦을 수 있어요.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      platforms:
        description: "올릴 곳 (쉼표로 구분)"
        default: "youtube,instagram,threads"
      yt_privacy:
        description: "유튜브 공개 범위 (public / unlisted / private)"
        default: "public"
      test:
        description: "시험 업로드 (true면 올린 기록을 남기지 않아 나중에 정식으로 다시 올라가요)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: upload

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 다음 편 올리기
        env:
          # 유튜브는 구글 심사 통과 전엔 비공개로만 올라가서, 예약 실행에선 일단 뺐어요.
          # 심사 통과 후 'youtube,instagram,threads' 로 바꾸면 돼요.
          PLATFORMS: ${{ inputs.platforms || 'instagram,threads' }}
          YT_PRIVACY: ${{ inputs.yt_privacy || 'public' }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
          TEST_RUN: ${{ inputs.test && 'true' || 'false' }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: python upload.py
      - name: 올린 기록 저장
        if: always() && !inputs.test
        run: |
          git config user.name "upload-bot"
          git config user.email "upload-bot@users.noreply.github.com"
          git add posted.json || true
          git diff --cached --quiet || (git commit -m "업로드 기록" && git push)
