name: 업로드

on:
  schedule:
    # 매일 18시쯤(KST) 올려요. 대기 영상이 7편 미만이면 월·수·금에만 올리고, 7편 이상 쌓이면 매일 올려요.
    # 유튜브는 바로 공개하면 쇼츠 피드에 안 떠서, 비공개로 올리고 10분 뒤 공개되게 예약해요(11/4).
    # 11/13~15 깃허브 예약이 6~8시간 늦어져 새벽 1시에 올라간 일이 있어서(11/16), 정각을 피해 여러 번 깨우고
    # 오늘 이미 올렸거나 저녁(18~21시 KST)이 아니면 그냥 넘어가요. 손으로 돌릴 때는 언제든 올라가요.
    - cron: "7 9 * * *"
    - cron: "37 9 * * *"
    - cron: "7 10 * * *"
    - cron: "37 10 * * *"
    - cron: "7 11 * * *"
    - cron: "37 11 * * *"
  workflow_dispatch:
    inputs:
      platforms:
        description: "올릴 곳 (쉼표로 구분)"
        default: "youtube,instagram,threads"
      yt_privacy:
        description: "유튜브 공개 범위 (public / unlisted / private)"
        default: "public"
      yt_publish_at:
        description: "유튜브 예약 공개 시각 (UTC, 예: 2026-11-02T09:00:00Z). 비우면 바로 올려요"
        default: ""
      test:
        description: "시험 업로드 (true면 올린 기록을 남기지 않아 나중에 정식으로 다시 올라가요)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: upload

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: 지금 올릴 때인지 확인
        id: gate
        if: github.event_name == 'schedule'
        run: |
          now_h=$(TZ=Asia/Seoul date +%H); today=$(TZ=Asia/Seoul date +%F)
          last=$(TZ=Asia/Seoul git log -1 --format=%cd --date=format-local:%F -- posted.json)
          if [ "$now_h" -lt 18 ] || [ "$now_h" -gt 21 ]; then echo "지금 ${now_h}시(KST)라 저녁이 아니어서 넘어가요"; echo skip=1 >> "$GITHUB_OUTPUT"
          elif [ "$last" = "$today" ]; then echo "오늘($today) 이미 올렸어요"; echo skip=1 >> "$GITHUB_OUTPUT"
          else echo "올릴게요"; fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 다음 편 올리기
        if: steps.gate.outputs.skip != '1'
        env:
          PLATFORMS: ${{ inputs.platforms || 'youtube,instagram,threads' }}
          YT_PRIVACY: ${{ inputs.yt_privacy || 'public' }}
          YT_PUBLISH_AT: ${{ inputs.yt_publish_at }}
          YT_PUBLISH_DELAY_MIN: "10"
          SCHEDULED: ${{ github.event_name == 'schedule' }}
          TEST_RUN: ${{ inputs.test && 'true' || 'false' }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: python upload.py
      - name: 올린 기록 저장
        if: always() && !inputs.test && steps.gate.outputs.skip != '1'
        run: |
          git config user.name "upload-bot"
          git config user.email "upload-bot@users.noreply.github.com"
          git add posted.json || true
          git diff --cached --quiet || (git commit -m "업로드 기록" && for i in 1 2 3 4; do git pull -q --rebase origin main && git push && break; sleep $((i*5)); done)
