name: 유튜브 상태 보기

# 올린 영상의 공개 상태·제한 여부를 공개 페이지에서 읽기만 해요. 아무것도 바꾸지 않아요.
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "영상 ID (쉼표로 구분). 채널 쇼츠 목록도 같이 봐요"
        default: "hF1oAVk8su0,YaZYfAPcaZs,4dZjY0voixk"

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests && python yt_page_diag.py "${{ inputs.ids }}"
